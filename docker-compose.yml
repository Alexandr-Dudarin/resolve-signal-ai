services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resolve_signal
      POSTGRES_USER: resolve_signal
      POSTGRES_PASSWORD: resolve_signal
    ports:
      - "5434:5432"
    volumes:
      - resolve_signal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve_signal -d resolve_signal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resolve_signal_postgres:
